services:
  - type: web
    name: kisanx-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: CORS_ORIGINS
        value: https://localhost,http://tauri.localhost,tauri://localhost
      - key: DATABASE_URL
        fromDatabase:
          name: kisanx-db
          property: connectionString

databases:
  - name: kisanx-db
    databaseName: kisanx
    user: kisanx
    plan: free
