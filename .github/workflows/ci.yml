name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      AUTO_CREATE_TABLES: "true"
      KISANX_OWNER_PIN: ci-test-owner-pin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and tests
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: python -m pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        working-directory: .
        run: node --check backend/web/assets/app.js && node --check backend/web/assets/payments.js
      - name: Verify native API configuration output
        working-directory: .
        env:
          KISANX_API_BASE: https://api.example.invalid
        run: node tools/build-native-web.mjs && node --check native-dist/assets/app-config.js
