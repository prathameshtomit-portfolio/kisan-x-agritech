name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      KISANX_API_BASE: ${{ vars.KISANX_API_BASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build mobile web assets
        run: npm run native:build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Generate Android app and launch icons
        run: npm run android:assets
      - name: Sync web assets to Android
        run: npx cap sync android
      - name: Build debug APK
        run: node tools/run-gradle.mjs assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KISAN-X-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    env:
      KISANX_API_BASE: ${{ vars.KISANX_API_BASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS installer
        run: npm run desktop:build
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KISAN-X-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
